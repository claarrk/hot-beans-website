<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hot beans</title>
<link rel="stylesheet" href="css/style.css">
<script src="javascript/drag.js" defer></script>
</head>
<body>

<nav class="sidenav">
  <img src="images/hotbeanlogo.png" width="100" height="100" alt="Hot Beans logo">
  <a href="index.html">home</a>
  <a href="profiles.html">profiles</a>
  <a href="jobs.html">jobs</a>
  <a href="application.html">application</a>
  <a href="links.html">links</a>
</nav>

<div class="field" id="box7">
  <br><input type="date" id="birthday" name="birthday" aria-label="birthday">
  <input type="submit">
</div>
<div class="tab" id="box6">birthday</div>

<div class="field" id="box9">
  <br>
  first name <input type="text" id="fname" name="fname">
  middle name <input type="text" id="mname" name="mname">
  surname <input type="text" id="sname" name="sname">
</div>
<div class="tab" id="box8">name</div>

<div class="field" id="box11">
  <br>
  <label for="jobtitle">choose a job:</label>
  <select name="jobtitle" id="jobtitle">
    <option value="projectmanager">project manager</option>
    <option value="softwareengineer">software engineer</option>
    <option value="websitedeveloper">website developer</option>
  </select>
</div>
<div class="tab" id="box10">job title</div>

<div class="field" id="box13">
  <br>
  street address <input type="text" id="fline" name="fline">
  street address line 2 <input type="text" id="sline" name="sline">
  state/province <input type="text" id="state" name="state">
  postal/zipcode <input type="text" id="zipcode" name="zipcode">
  <br>
  country <input type="text" id="country" name="country">
  city <input type="text" id="city" name="city">
</div>
<div class="tab" id="box12">address</div>

<div class="field" id="box15">
  <br>
  phone number <input type="tel" id="tel" name="tel">
  email address <input type="email" id="email" name="email">
</div>
<div class="tab" id="box14">contact</div>

<div class="field" id="box17">
  <br>
  <div class="drop-zone">
    <span class="drop-zone__prompt">drop</span>
    <input type="file" name="myFile" class="drop-zone__input">
  </div>
  <button class="button">submit</button>
</div>
<div class="tab" id="box16">cv</div>

</body>
</html>
